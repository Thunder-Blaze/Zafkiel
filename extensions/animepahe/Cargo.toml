[package]
name = "animepahe-ext"
version = "0.1.0"
edition = "2021"
description = "AnimePahe streaming source extension for Zafkiel"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"

[profile.release]
# Shrink WASM binary size
opt-level = "s"
lto = true
