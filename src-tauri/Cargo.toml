[package]
name = "Zafkiel"
version = "0.1.0"
description = "Zafkiel Backend"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.89.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
log = "0.4"
tauri = { version = "2.8.5", features = ["protocol-asset"] }
tauri-plugin-log = "2.7.0"
# Switching to local path for easier development
# anilist_moe = "0.2.0"
anilist_moe = { path = "../../../anilist-moe" }
ron = "0.8"
aes-gcm = "0.11.0-rc.1"
base64 = "0.22"
rand = "0.8"
thiserror = "2.0"
directories = "5.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
url = "2.5"
urlencoding = "2.1"
open = "5.3"
dotenvy = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
